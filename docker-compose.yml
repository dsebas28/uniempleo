# Base de datos PostgreSQL para desarrollo local.
#   docker compose up -d
# Coincide con DATABASE_URL de backend/.env.example
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: uniempleo
      POSTGRES_USER: uniempleo
      POSTGRES_PASSWORD: uniempleo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniempleo -d uniempleo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
